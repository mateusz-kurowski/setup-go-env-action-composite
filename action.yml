name: 'Setup Go Environment'
description: 'Checkout code and install go'
runs:
  using: "composite"
  steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.25"
        cache-dependency-path: go.sum
